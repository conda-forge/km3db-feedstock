{% set name = "km3db" %}
{% set version = "0.15.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/km3db-{{ version }}.tar.gz
  sha256: a7ad0809932bcfdbc1a1321d17b032accc6e2e9bdf0ca6e8039929c5420ff117

build:
  number: 0
  noarch: python
  entry_points:
    - km3db=km3db.cli.km3db:main
    - streamds=km3db.cli.streamds:main
    - detx=km3db.cli.detx:main
    - runtable=km3db.cli.runtable:main
    - runinfo=km3db.cli.runinfo:main
    - wtd=km3db.cli.wtd:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools_scm
  run:
    - python >=3.8
    - docopt
    - pytz
    - requests
    - setuptools-scm
    - numpy

test:
  imports:
    - km3db
  commands:
    - pip check
    - km3db --help
    - streamds --help
    - detx --help
    - runtable --help
    - runinfo --help
    - wtd --help
  requires:
    - pip

about:
  home: https://git.km3net.de/km3py/km3db
  summary: KM3NeT database library
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - tamasgal
